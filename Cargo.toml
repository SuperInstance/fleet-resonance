[package]
name = "fleet-resonance"
version = "0.1.0"
edition = "2021"
authors = ["SuperInstance"]
description = "Perturbation-response probing for LLM decision graphs — the luthier's hammer for AI systems"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
ndarray = "0.16"
statrs = "0.16"
base64 = "0.22"
clap = { version = "4.0", features = ["derive"] }

[dev-dependencies]
mockito = "1.6"
tempfile = "3"

[[bin]]
name = "fleet-resonance"
path = "src/main.rs"

[lib]
name = "fleet_resonance"
path = "src/lib.rs"